sonar.projectKey=m-ahmad-butt_UnCooked
sonar.organization=m-ahmad-butt
sonar.sourceEncoding=UTF-8

# SonarCloud "new analysis scope UX" ignores sonar.sources/sonar.tests.
# Gate Phase 01 on unit-tested backend modules; ESLint/Snyk/Trivy cover the rest.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  web/frontend/**,\
  web/agent/**,\
  terraform/**,\
  images/**,\
  scripts/**,\
  .github/**,\
  **/*.md,\
  **/Dockerfile,\
  web/backend/tests/**,\
  web/backend/scripts/**,\
  web/backend/src/controllers/**,\
  web/backend/src/routes/**,\
  web/backend/src/models/**,\
  web/backend/src/config/**,\
  web/backend/src/repositories/**,\
  web/backend/src/server.js,\
  web/backend/src/middleware/auth.middleware.js,\
  web/backend/src/middleware/rateLimiter.middleware.js,\
  web/backend/src/services/import.service.js,\
  web/backend/src/services/email.service.js,\
  web/backend/src/services/cleanup.service.js,\
  web/backend/src/services/seed.service.js,\
  web/backend/src/services/agent.service.js,\
  web/backend/src/services/cnicOcr.service.js,\
  web/backend/src/services/datesheetPdf.service.js

sonar.javascript.lcov.reportPaths=web/backend/coverage/lcov.info
sonar.coverage.exclusions=**/tests/**,**/*.test.js
sonar.cpd.exclusions=**/controllers/**,**/routes/**
