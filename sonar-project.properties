sonar.projectKey=m-ahmad-butt_UnCooked
sonar.organization=m-ahmad-butt
# Backend only for gate: frontend prettier churn was dragging Security/Reliability to C
# and 0%/low coverage (no frontend unit suite). ESLint/Prettier still cover frontend in CI.
sonar.sources=web/backend/src
sonar.tests=web/backend/tests
sonar.javascript.lcov.reportPaths=web/backend/coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/import.service.js,**/controllers/**,**/routes/**,**/models/**,**/config/**,**/middleware/auth.middleware.js,**/middleware/rateLimiter.middleware.js,**/services/email.service.js,**/services/cleanup.service.js,**/services/seed.service.js,**/server.js
sonar.cpd.exclusions=**/controllers/**,**/routes/**
sonar.sourceEncoding=UTF-8
