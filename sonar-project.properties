sonar.projectKey=m-ahmad-butt_UnCooked
sonar.organization=m-ahmad-butt
sonar.sources=web/frontend/src,web/backend/src,web/agent/app
sonar.tests=web/backend/tests
sonar.javascript.lcov.reportPaths=web/backend/coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
# Frontend/agent have no Jest/c8 suite yet do not count as 0% on new code
sonar.coverage.exclusions=**/web/frontend/**,**/web/agent/**,**/tests/**,**/*.test.js
# Admin CRUD pages are structurally similar keep CPD under Sonar-way 3%
sonar.cpd.exclusions=**/web/frontend/src/pages/**
# qualitygate.wait is set in CI only on main (free SonarCloud blocks non-main QG API)
sonar.sourceEncoding=UTF-8
