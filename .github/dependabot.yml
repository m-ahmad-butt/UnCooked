version: 2
updates:
  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /web/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /web/frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /web/backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /web/agent
    schedule:
      interval: weekly
